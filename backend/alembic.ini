# Alembic configuration for Operations Under Pressure.
# The database URL is read from the application settings (env-driven), so the
# same migrations run against SQLite in tests and PostgreSQL in production.

[alembic]
script_location = alembic
prepend_sys_path = .
    # PostgreSQL in production (postgresql+psycopg://...);
    sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/operations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
